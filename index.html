<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Course</title>
<meta name="description" content="AWS course study days — one interactive page per session day.">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <div class="wrap headbar"><button id="themeBtn" class="themebtn" onclick="themeToggle()" aria-pressed="false">Switch to light</button></div>
  <div class="wrap">
    <h1>AWS Course</h1>
    <p class="tagline">Study notes and drills for the AWS cloud — one interactive page per session day.</p>
    <div class="badges">
      <span class="badge">Static HTML/CSS</span>
      <span class="badge">No build step</span>
      <span class="badge">GitHub Pages</span>
    </div>
  </div>
</header>
<main class="wrap">

  <section class="info" id="day-notes" style="border-top:0;padding-top:24px">
    <h2>Session days — latest first</h2>
    <div class="grid" id="daygrid" style="padding:8px 0 16px;border-top:0"><noscript>JavaScript is off — open <a href="days.json">days.json</a> for the day list or jump to <a href="2026-10-27/">the 2026-10-27 session (AWS Networking Fundamentals)</a>.</noscript></div>
  </section>

</main>
<footer>
  <div class="wrap">AWS Course · hosted on GitHub Pages · source on main</div>
</footer>
<script>
function renderDays(){
  var g=document.getElementById("daygrid");
  if(!g||g.dataset.rendered)return;
  g.dataset.rendered="true";
  fetch("days.json?" + Date.now()).then(function(r){return r.json()}).then(function(d){
    var days=(d.days||[]).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
    g.innerHTML=days.map(function(day){
      return '<a class="card" href="'+day.url+'"><h3>'+day.date+' · '+day.title+'</h3><p>'+(day.summary||"")+'</p></a>';
    }).join("\n");
  }).catch(function(e){
    g.innerHTML='<a class="card" href="2026-10-27/"><h3>2026-10-27 · AWS Networking Fundamentals</h3><p>(day list unavailable — showing latest known day)</p></a>';
  });
}
renderDays();
</script>
<script src="theme.js"></script>
</body>
</html>
